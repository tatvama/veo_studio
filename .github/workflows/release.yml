# Releases and deployment.
#
# 1. Every push to main: release-please reads the conventional-commit titles since the last release and keeps a
#    "chore: release X.Y.Z" pull request up to date (version bump + CHANGELOG.md).
# 2. Merging that pull request tags vX.Y.Z and publishes a GitHub Release with the changelog.
# 3. The release's Docker image is pushed to ghcr.io/<owner>/<repo> (tags X.Y.Z, X.Y, X, latest).
# 4. If the COOLIFY_WEBHOOK_URL secret is set, the "production" environment is redeployed and checked.
# 5. The Windows desktop installer (desktop/, Electron) is built, attached to the same GitHub Release, and published
#    to the public, releases-only repository tatvama/tatvam-desktop-releases (no source code). Installed apps update
#    themselves from there, so they need no token even when this repository is private. Optional secrets
#    WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD sign it.
#
# Optional secrets (Settings → Secrets and variables → Actions):
#   RELEASE_PLEASE_TOKEN  fine-grained PAT (contents + pull requests: read/write). Without it the release PR is
#                         opened by GITHUB_TOKEN, and GitHub does not run CI on PRs opened by that token.
#   COOLIFY_WEBHOOK_URL   Coolify → your app → Webhooks → "Deploy webhook" URL
#   COOLIFY_TOKEN         Coolify → Keys & Tokens → API token (deploy permission)
#   DESKTOP_RELEASES_TOKEN  fine-grained PAT for tatvama/tatvam-desktop-releases only (Contents: read and write).
#                         Required for desktop updates: without it the installer stays on this repository's release
#                         only, the job fails with a clear message, and installed apps don't see the new version.
# Optional variables:
#   PRODUCTION_URL        e.g. https://studio.example.com — after deploying, waits until /api/health/live reports the new version
#   DESKTOP_RELEASES_REPO the releases-only repository (default tatvama/tatvam-desktop-releases); it must match
#                         `publish` in desktop/electron-builder.yml
#
# Manual run (Actions → Release → Run workflow) with "publish_tag" = an existing tag such as v3.0.0: builds and
# publishes that tag's image and deploys it, without release-please. Also the way to roll back to an older release
# (it moves the X, X.Y and latest image tags to that release).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag to build, publish and deploy (e.g. v3.0.0). Empty = normal release-please run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    if: ${{ !inputs.publish_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish Docker image
    needs: release-please
    if: ${{ !failure() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.publish_tag) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Resolve tag and version
        env:
          TAG: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.v.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Tatvam AI Studio
            org.opencontainers.image.description=AI video studio: API, background worker and web app in one image

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-installer:
    name: Desktop installer (Windows)
    needs: release-please
    if: ${{ !failure() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.publish_tag) }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write   # upload the installer to the GitHub Release (electron-updater reads latest.yml from there)
    env:
      TAG: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASES_REPO: ${{ vars.DESKTOP_RELEASES_REPO || 'tatvama/tatvam-desktop-releases' }}
      RELEASES_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
      # Optional code signing (avoids SmartScreen warnings): a base64 .pfx in WIN_CSC_LINK + its password
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the web app (bundled into the installer)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD   # unsigned build when no certificate is set
          npm ci --no-audit --no-fund
          npm run dist -- --publish never

      - name: Upload to the release
        working-directory: desktop
        shell: bash
        run: gh release upload "$TAG" release/*.exe release/*.blockmap release/latest.yml --clobber

      # Installed apps read latest.yml from the releases-only repository (electron-builder.yml `publish`).
      - name: Publish to the releases-only repository (where installed apps update from)
        working-directory: desktop
        shell: bash
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::DESKTOP_RELEASES_TOKEN is not set, so $TAG was not published to $RELEASES_REPO and installed apps won't see it. Add the secret, then run this workflow with publish_tag=$TAG."
            exit 1
          fi
          # the same release notes as this repository's release (the app shows them as "What's new")
          gh release view "$TAG" --json body --jq .body > notes.md || echo "Tatvam Studio $TAG" > notes.md
          export GH_TOKEN="$RELEASES_TOKEN"
          if gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$RELEASES_REPO" --notes-file notes.md --latest
          else
            gh release create "$TAG" --repo "$RELEASES_REPO" --title "Tatvam Studio ${TAG#v}" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" --repo "$RELEASES_REPO" release/*.exe release/*.blockmap release/latest.yml --clobber
          echo "Published $TAG to https://github.com/$RELEASES_REPO/releases/tag/$TAG"

  deploy:
    name: Deploy to production
    needs: publish-image
    if: ${{ !failure() && !cancelled() && needs.publish-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      VERSION: ${{ needs.publish-image.outputs.version }}
    steps:
      - name: Skip (no deploy webhook configured)
        if: ${{ env.COOLIFY_WEBHOOK_URL == '' }}
        run: echo "::notice::COOLIFY_WEBHOOK_URL is not set, so v$VERSION was released but not deployed."

      - name: Trigger Coolify deploy
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X GET "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_TOKEN"
          echo "Deploy of v$VERSION requested"

      - name: Wait for the new version to go live
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' && env.PRODUCTION_URL != '' }}
        run: |
          for i in $(seq 1 60); do
            got=$(curl -fsS "$PRODUCTION_URL/api/health/live" | sed -nE 's/.*"version":"([^"]+)".*/\1/p' || true)
            echo "attempt $i: live version '${got}'"
            if [ "$got" = "$VERSION" ]; then
              curl -fsS "$PRODUCTION_URL/api/health/ready" && echo && echo "v$VERSION is live" && exit 0
            fi
            sleep 15
          done
          echo "::error::$PRODUCTION_URL did not report v$VERSION within 15 minutes"
          exit 1
