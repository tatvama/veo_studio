# Runs on every pull request and every push to main.
# Branch protection requires the "CI ok" job, which passes only when every job above it passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a new push to a PR cancels the old run; runs on main always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check --output-format=github .

      - name: Tests (mock providers)
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # same as the Dockerfile's build stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: veo-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start the container, check health + web app)
        run: |
          docker run -d --name smoke -p 8100:8100 -e APP_SECRET=ci-smoke-test veo-studio:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8100/api/health/live > live.json; then break; fi
            sleep 2
          done
          cat live.json
          expected=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' backend/app/__init__.py)
          grep -q "\"version\":\"$expected\"" live.json || { echo "::error::/api/health/live did not report version $expected"; exit 1; }
          curl -fsS http://localhost:8100/api/health/ready
          curl -fsS http://localhost:8100/ | grep -q '<div id="root">' || { echo "::error::the web app is not served on /"; exit 1; }
          echo "Smoke test passed"

      - name: Container logs
        if: ${{ always() }}
        run: docker logs smoke 2>&1 | tail -100 || true

  ci-ok:
    name: CI ok
    if: ${{ always() }}
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: echo "All CI jobs passed"
      - name: Some job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more CI jobs did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
