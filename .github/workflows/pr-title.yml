# Pull requests are squash-merged, so the PR title becomes the commit on main and the line in CHANGELOG.md.
# It must follow Conventional Commits: "<type>(<optional scope>): <summary>", e.g. "feat(director): undo last action".
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^\S.*$
          subjectPatternError: |
            The summary after "type: " must not be empty. Example: "fix(timeline): keep music ducking after a trim"
