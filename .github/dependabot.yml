# Weekly dependency updates. Minor and patch updates arrive grouped in one PR per ecosystem;
# major updates get their own PR so they can be tested on their own.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, backend]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, frontend]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]


# Base images (python:3.12-slim, node:22-slim, postgres:16) are upgraded by hand: a new Python, Node or
# Postgres major needs testing (and for Postgres a data migration), which a bot PR can't do.
