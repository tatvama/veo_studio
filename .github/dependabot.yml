# Weekly dependency updates. npm and GitHub Actions: minor and patch updates arrive grouped in one PR;
# major updates get their own PR so they can be tested on their own.
# Python: backend/requirements.txt uses minimum versions (">=") and every Docker build installs the newest
# matching release, so raising the minimums would be noise. Dependabot only opens a PR when a new release is
# outside the allowed range (e.g. anthropic 2.x vs "<2") or for a security fix (security updates always run).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, frontend]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]


# Base images (python:3.12-slim, node:22-slim, postgres:16) are upgraded by hand: a new Python, Node or
# Postgres major needs testing (and for Postgres a data migration), which a bot PR can't do.
