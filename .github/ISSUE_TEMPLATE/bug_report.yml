name: Bug report
description: Something in the studio doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project → 3 Shots → Storyboard
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown by GET /api/health/live ("version"), or the commit you run.
      placeholder: "3.0.0"
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options:
        - Local dev (Windows)
        - Local dev (macOS / Linux)
        - Docker Compose
        - Coolify
        - Other
  - type: dropdown
    id: mode
    attributes:
      label: Providers
      options:
        - Mock mode (no keys)
        - Real providers
  - type: textarea
    id: logs
    attributes:
      label: Logs or job errors
      description: Server log lines or the failed job's error. Remove keys, tokens and personal data first.
      render: text
