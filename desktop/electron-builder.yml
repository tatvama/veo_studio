# Tatvam Studio desktop installer (npm run dist → desktop/release). Code signing comes from the environment:
#   CSC_LINK (path or base64 of the .pfx) and CSC_KEY_PASSWORD; without them the installer is built unsigned.
# Updates (electron-updater) check the downloaded installer's Authenticode signature against win.publisherName before
# installing it. That check only has teeth once builds are signed: an unsigned build has no signature to compare, so
# until a certificate is added (docs/DESKTOP.md §6) an update is protected by TLS to GitHub and the blockmap alone.
appId: com.tatvam.studio
productName: Tatvam Studio
copyright: Copyright © 2026 Tatvam
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
  # ffmpeg-static is only a dev fallback: the app ships FFmpeg as resources/ffmpeg.exe
  - "!**/node_modules/ffmpeg-static/**"
asar: true
# the built web UI and FFmpeg sit next to the app: resources/web and resources/ffmpeg.exe
# (scripts/prepare-dist.mjs copies the UI and the best FFmpeg build into build/ first)
extraResources:
  - from: build/web
    to: web
  - from: build/ffmpeg/ffmpeg.exe
    to: ffmpeg.exe
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Tatvam-Studio-Setup-${version}.${ext}
  # The certificate's subject name(s): electron-updater refuses an update whose signature was made by anyone else.
  # Must match the CN of the certificate behind CSC_LINK exactly (change it here when the certificate is bought).
  publisherName:
    - Tatvam
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Tatvam Studio
protocols:
  - name: Tatvam Studio
    schemes: [tatvam]
# Updates come from a public, releases-only repository (no source code), so installed apps can update without a
# token even when the code repository is private. The release workflow publishes there (.github/workflows/release.yml).
publish:
  provider: github
  owner: tatvama
  repo: tatvam-desktop-releases
  releaseType: release
