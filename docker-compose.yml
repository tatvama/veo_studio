# VEO Studio on Unraid / a VPS / Docker Desktop (Windows).
#   1. Copy .env.example to .env and fill it in (keys, APP_SECRET, PUBLIC_BASE_URL, POSTGRES_PASSWORD).
#   2. docker compose up -d --build
#   3. Open http://<server-ip>:8100 and create the first admin.
# For team access from anywhere without opening ports: docker compose --profile tunnel up -d (needs CLOUDFLARE_TUNNEL_TOKEN).
# On Coolify, set the same variables in the app's Environment instead of .env. The AI keys are read by api AND worker:
#   GEMINI_API_KEY, FAL_KEY, OPENROUTER_API_KEY, BYTEPLUS_API_KEY, BYTEPLUS_ACCESS_KEY, BYTEPLUS_SECRET_KEY
#   (+ BYTEPLUS_REGION, BYTEPLUS_PROJECT). BytePlus and OpenRouter fetch input images by link, so they need
#   STORAGE_BACKEND=s3 with the bucket settings. Readiness (database reachable): GET /api/health/ready.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veo
      POSTGRES_USER: veo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veo -d veo"]
      interval: 10s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://veo:${POSTGRES_PASSWORD}@db:5432/veo
      RUN_WORKER_IN_PROCESS: "false"
      FRONTEND_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:8100}
    volumes:
      - ./data/studio:/data
    ports:
      - "8100:8100"
    healthcheck:
      # liveness only (no database), so a slow database never gets the web app restarted; readiness: /api/health/ready
      test: ["CMD", "python", "-m", "app.health", "api"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://veo:${POSTGRES_PASSWORD}@db:5432/veo
    command: ["python", "-m", "app.workers.run"]
    healthcheck:
      # the worker has no web port: it is healthy while its job loop keeps beating (every few seconds)
      test: ["CMD", "python", "-m", "app.health", "worker"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    volumes:
      - ./data/studio:/data
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [api]
